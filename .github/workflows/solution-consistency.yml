# Checks that a change produces the same solutions: generates puzzles with fixed seeds on the base and on the changed
# code, and fails if any puzzle (or any difficulty check result on it) differs. See .github/consistency/.
name: Solution consistency

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/consistency/**'
      - '.github/workflows/solution-consistency.yml'
  workflow_dispatch:
    inputs:
      base:
        description: 'Ref to compare against'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out changed code
        uses: actions/checkout@v4
        with:
          path: changed

      - name: Check out base
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (changed)
        working-directory: changed
        run: npm install --no-audit --no-fund

      - name: Install dependencies (base)
        working-directory: base
        run: npm install --no-audit --no-fund
        env:
          # The runner uses the changed checkout's Puppeteer
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Generate puzzles (base)
        run: node changed/.github/consistency/run.mjs base base-results.json

      - name: Generate puzzles (changed)
        run: node changed/.github/consistency/run.mjs changed changed-results.json

      - name: Compare
        run: node changed/.github/consistency/compare.mjs base-results.json changed-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-results
          path: '*-results.json'
          if-no-files-found: ignore
